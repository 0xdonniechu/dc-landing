    (function () {
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const PROMPT = vars.prompt || "build me a landing page";
      const tl = gsap.timeline({ paused: true });
      const typed = document.querySelector("#promo-typed");
      const ringN = document.querySelector("#promo-ring-n");
      const RING = 678.6;

      // Frame 0 is the loop's rest state: headline 1, empty prompt bar, cursor.
      tl.set("#promo-head-1", { opacity: 1, filter: "blur(0px)" }, 0);

      // 0.3 → 2.3 s: type the prompt (text is a function of timeline time)
      const t1 = { n: 0 };
      tl.fromTo(t1, { n: 0 }, {
        n: PROMPT.length, duration: 1.9, ease: "none",
        onUpdate: () => { typed.textContent = PROMPT.slice(0, Math.round(t1.n)); },
      }, 0.3);

      // 2.6 s: prompt bar morphs into the terminal (ease out, blur swap headline)
      tl.to("#promo-term", { height: 760, y: -80, duration: 0.55, ease: "power3.inOut" }, 2.6);
      tl.to("#promo-term-bg", { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 2.65);
      tl.to("#promo-term-bar", { opacity: 1, duration: 0.25 }, 2.9);
      tl.to("#promo-prompt", { y: 64, scale: 0.826, color: "#f7f5f0", duration: 0.55, ease: "power3.inOut" }, 2.6);
      tl.to("#promo-prompt .gt", { color: "#f2c230", duration: 0.3 }, 2.7);
      tl.to("#promo-caret", { opacity: 0, duration: 0.1 }, 2.6);

      tl.to("#promo-head-1", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 2.7);
      tl.fromTo("#promo-head-2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 2.86);

      // 3.1 → 5.4 s: steps appear, then tick one by one
      tl.fromTo("#promo-steps li", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out", stagger: 0.06 }, 3.1);
      [1, 2, 3, 4, 5].forEach((i) => {
        const at = 3.6 + (i - 1) * 0.36;
        tl.fromTo(`#promo-step-${i} .box b`, { scale: 0 }, { scale: 1, duration: 0.28, ease: "back.out(1.6)" }, at);
        tl.fromTo(`#promo-step-${i} .step-on`, { opacity: 0 }, { opacity: 1, duration: 0.12 }, at);
      });

      // 5.7 s: terminal leaves (accelerating), report card lands
      tl.to("#promo-term", { y: -220, scale: 0.86, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power3.in" }, 5.6);
      tl.fromTo("#promo-report", { opacity: 0, y: 160, rotation: 4 }, { opacity: 1, y: 0, rotation: -2, duration: 0.6, ease: "expo.out" }, 5.85);
      tl.to("#promo-head-2", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 5.7);
      tl.fromTo("#promo-head-3", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 5.86);
      tl.fromTo("#promo-nerd", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 6.2);

      // ring to 6/8, fix the two flags, ring to 8/8
      const t2 = { v: 0 };
      tl.fromTo(t2, { v: 0 }, {
        v: 6, duration: 0.9, ease: "power2.out", immediateRender: false,
        onUpdate: () => { ringN.textContent = Math.round(t2.v); },
      }, 6.3);
      tl.fromTo("#promo-ring-fg", { attr: { "stroke-dashoffset": RING } }, { attr: { "stroke-dashoffset": RING * (2 / 8) }, duration: 0.9, ease: "power2.out" }, 6.3);
      tl.to("#promo-r2", { opacity: 0, duration: 0.12 }, 7.6);
      tl.fromTo("#promo-r2-fix", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 7.62);
      tl.to("#promo-r5", { opacity: 0, duration: 0.12 }, 7.95);
      tl.fromTo("#promo-r5-fix", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 7.97);
      const t3 = { v: 6 };
      tl.fromTo(t3, { v: 6 }, {
        v: 8, duration: 0.5, ease: "power2.out", immediateRender: false,
        onUpdate: () => { if (tl.time() >= 8.0) ringN.textContent = Math.round(t3.v); },
      }, 8.0);
      tl.to("#promo-ring-fg", { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.out" }, 8.0);
      tl.set("#promo-report-tag", { textContent: "PASSED", background: "#141414" }, 8.3);
      tl.set("#promo-ring-sub", { textContent: "all clear" }, 8.3);

      // 8.9 s: colour flood to blue from behind the card, ship card arrives
      tl.fromTo("#promo-flood", { clipPath: "circle(0% at 50% 62%)" }, { clipPath: "circle(150% at 50% 62%)", duration: 0.55, ease: "power2.inOut" }, 8.8);
      tl.to(["#promo-report", "#promo-nerd"], { opacity: 0, scale: 0.9, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, 8.85);
      tl.to("#promo-head-3", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 8.85);
      tl.to(["#promo-kicker", "#promo-brand"], { color: "#f7f5f0", duration: 0.3 }, 8.95);
      tl.fromTo("#promo-head-ship", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 9.15);
      tl.fromTo("#promo-ship", { opacity: 0, scale: 0.7, rotation: -6 }, { opacity: 1, scale: 1, rotation: 2, duration: 0.65, ease: "elastic.out(1, 0.75)" }, 9.2);
      tl.fromTo("#promo-mascot", { opacity: 0, y: 120, rotation: 10 }, { opacity: 1, y: 0, rotation: 0, duration: 0.6, ease: "back.out(1.5)" }, 9.55);

      // 11.2 → 12 s: everything returns to frame 0 so the loop is seamless
      tl.to("#promo-flood", { clipPath: "circle(0% at 50% 62%)", duration: 0.5, ease: "power2.inOut" }, 11.25);
      tl.to(["#promo-ship", "#promo-mascot"], { opacity: 0, scale: 0.92, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, 11.2);
      tl.to("#promo-head-ship", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 11.2);
      tl.to(["#promo-kicker", "#promo-brand"], { color: "#141414", duration: 0.3 }, 11.4);
      tl.set("#promo-kicker", { color: "#0038a8" }, 11.71);
      // rebuild the start state of the prompt bar
      tl.set("#promo-term", { y: 0, scale: 1, filter: "blur(0px)", height: 150 }, 11.3);
      tl.set("#promo-term-bg", { opacity: 0 }, 11.3);
      tl.set("#promo-term-bar", { opacity: 0 }, 11.3);
      tl.set("#promo-steps li", { opacity: 0 }, 11.3);
      tl.set("#promo-prompt", { y: 0, scale: 1, color: "#141414" }, 11.3);
      tl.set("#promo-prompt .gt", { color: "#0038a8" }, 11.3);
      tl.set("#promo-caret", { opacity: 1 }, 11.3);
      tl.set(typed, { textContent: "" }, 11.3);
      tl.fromTo("#promo-term", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 11.5);
      tl.fromTo("#promo-head-1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", immediateRender: false }, 11.55);

      window.__timelines["promo"] = tl;
    })();
  </script>
